<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="500"
   height="500"
   viewBox="0 0 500 500"
   version="1.1"
   id="svg3"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <defs
     id="defs3" />
  <title
     id="title1">Nōmadia Logo</title>
  <desc
     id="desc1">Minimalist paper airplane logo for Nōmadia travel company</desc>
  <style
     id="style1">
    .brand-text {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 72px;
      letter-spacing: -1px;
    }
    .plane-shape {
      fill: #F97316;
      stroke: #F97316;
      stroke-width: 15;
      stroke-linejoin: round;
    }
    .plane-crease {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0.6;
    }
  </style>
  <!-- Paper Airplane Icon -->
  <g
     transform="translate(0, -20)"
     id="g3">
    <!-- Main geometric body of the paper plane -->
    <path
       class="plane-shape"
       d="M 120 280 L 400 120 L 280 400 L 240 240 Z"
       id="path1" />
    <!-- Internal folds to suggest origami structure -->
    <path
       class="plane-crease"
       d="M 400 120 L 240 240"
       id="path2" />
    <path
       class="plane-crease"
       d="M 120 280 L 240 240"
       id="path3" />
  </g>
  <!-- Company Name -->
  <metadata
     id="metadata3">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Nōmadia Logo</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
